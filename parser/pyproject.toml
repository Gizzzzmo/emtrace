[project]
name = "emtrace"
dynamic = ["version"]
description = "A tool to parse and format emtrace data."
readme = "README.md"
authors = [{name = "Jonas Beyer", email = "reyeb.sanoj@googlemail.com"}]
license = {file="LICENSE"}
keywords = ["embedded", "logging", "tracing"]
dependencies = [
    "lief>=0.17",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2.2",
    "pytest-xdist>=3.6.1",
]

[project.scripts]
emtrace = "emtrace.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Single source of truth for the version is emtrace/__init__.py's __version__.
[tool.hatch.version]
path = "emtrace/__init__.py"

# Bake the build's git commit into emtrace/_build_info.py (see hatch_build.py).
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["emtrace/*.py", "hatch_build.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

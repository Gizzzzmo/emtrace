[package]
name = "emtrace"
description = "Minimal overhead tracing/logging library for embedded, and resource constrained projects."
version = "0.1.0"
edition = "2024"
authors = ["Jonas Beyer"]
readme = "../README.md"
repository = "https://github.com/Gizzzzmo/emtrace"
license = "Apache-2.0"

[features]
default = ["std", "alignment_power_8"]
std = []
alignment_power_0 = []
alignment_power_1 = []
alignment_power_2 = []
alignment_power_3 = []
alignment_power_4 = []
alignment_power_5 = []
alignment_power_6 = []
alignment_power_7 = []
alignment_power_8 = []
alignment_power_9 = []
alignment_power_10 = []

[[example]]
name = "test_basic"

[[example]]
name = "test_strings"

[[example]]
name = "test_integers"

[[example]]
name = "test_f32"

[[example]]
name = "test_doubles"

[[example]]
name = "test_bool"

[[example]]
name = "test_vec"

[[example]]
name = "test_mixed"

[[example]]
name = "test_large_numbers"

[[example]]
name = "test_edge_cases"

[[example]]
name = "demo_no_std"

[[example]]
name = "demo_stdout"

[[example]]
name = "demo_error_handling"

[[example]]
name = "demo_readme"

[[bench]]
name = "basic"
harness = false

[dependencies]
cfg-if = "1.0.3"
emtrace-macros = { path = "../emtrace-macros" }

[dev-dependencies]
criterion = "0.7.0"

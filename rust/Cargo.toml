[package]
name = "emtrace"
description = "Minimal overhead tracing/logging library for embedded, and resource constrained projects."
version = "0.1.0"
edition = "2024"
authors = ["Jonas Beyer"]
readme = "README.md"
repository = "https://github.com/Gizzzzmo/emtrace"
license = "Apache-2.0"

[dependencies]

[features]
# The minimum record alignment of this build: the strongest enabled minimum wins.
# Note that all lower minimum powers would be no-ops: the default_alignment_1
# feature can select the floor, so a 1-byte minimum would raise nothing.
minimum_alignment_2 = []
minimum_alignment_4 = []
minimum_alignment_8 = []
minimum_alignment_16 = []
minimum_alignment_32 = []
minimum_alignment_64 = []
minimum_alignment_128 = []
minimum_alignment_256 = []
minimum_alignment_512 = []
minimum_alignment_1024 = []
# The base alignment in effect when no minimum forces it higher. At most one of
# these may be enabled - enabling two or more is a compile error. Without any of
# them, the base alignment is 2^8 = 256 bytes.
default_alignment_1 = []
default_alignment_2 = []
default_alignment_4 = []
default_alignment_8 = []
default_alignment_16 = []
default_alignment_32 = []
default_alignment_64 = []
default_alignment_128 = []
default_alignment_256 = []
default_alignment_512 = []
default_alignment_1024 = []

[[bench]]
name = "basic"
harness = false


[dev-dependencies]
criterion = "0.7.0"
